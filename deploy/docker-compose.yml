services:
  static:
    image: nginx:1.30.4-alpine3.24@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: ten-fingers-static
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - /srv/ten-fingers:/srv/ten-fingers:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.tenfingers-static-de.rule: "Host(`www.tenfingers.app`)"
      traefik.http.routers.tenfingers-static-de.entrypoints: websecure
      traefik.http.routers.tenfingers-static-de.priority: "10000"
      traefik.http.routers.tenfingers-static-de.tls.certresolver: mytlschallenge
      traefik.http.routers.tenfingers-static-de.service: tenfingers-static
      traefik.http.routers.tenfingers-static-en.rule: "Host(`en.tenfingers.app`)"
      traefik.http.routers.tenfingers-static-en.entrypoints: websecure
      traefik.http.routers.tenfingers-static-en.priority: "10000"
      traefik.http.routers.tenfingers-static-en.tls.certresolver: mytlschallenge
      traefik.http.routers.tenfingers-static-en.service: tenfingers-static
      traefik.http.services.tenfingers-static.loadbalancer.server.port: "80"

networks:
  web:
    external: true
